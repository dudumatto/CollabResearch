spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.application.name=tcc-backend

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:require}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.validate-migration-naming=true

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:}
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:120}
app.rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:60000}

app.security.trusted-proxies=${TRUSTED_PROXY_CIDRS:}
app.login-bruteforce.enabled=${LOGIN_BRUTEFORCE_ENABLED:true}
app.login-bruteforce.pair-max-attempts=${LOGIN_BRUTEFORCE_PAIR_MAX_ATTEMPTS:5}
app.login-bruteforce.email-max-attempts=${LOGIN_BRUTEFORCE_EMAIL_MAX_ATTEMPTS:10}
app.login-bruteforce.ip-max-attempts=${LOGIN_BRUTEFORCE_IP_MAX_ATTEMPTS:20}
app.login-bruteforce.window-ms=${LOGIN_BRUTEFORCE_WINDOW_MS:900000}
app.login-bruteforce.lock-ms=${LOGIN_BRUTEFORCE_LOCK_MS:300000}
app.login-bruteforce.max-lock-ms=${LOGIN_BRUTEFORCE_MAX_LOCK_MS:1800000}
