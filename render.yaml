services:
  - type: web
    name: collabresearch-backend
    runtime: docker
    rootDir: backend/tcc-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: JPA_DDL_AUTO
        value: validate
      - key: JPA_SHOW_SQL
        value: "false"
      - key: FLYWAY_ENABLED
        value: "true"
      - key: FLYWAY_BASELINE_ON_MIGRATE
        value: "true"
      - key: FLYWAY_BASELINE_VERSION
        value: "1"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "2592000000"
      - key: CRON_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: "http://localhost:*,http://127.0.0.1:*,https://collab-research.vercel.app,https://*.vercel.app"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: SUPABASE_PROJECT_DOCUMENTS_BUCKET
        value: project-deliveries
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ALLOWED_DOMAINS
        value: unicamp.br
      - key: GOOGLE_TIMEOUT_MS
        value: "3000"
